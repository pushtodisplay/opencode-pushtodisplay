name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the release workflow. npm 11 (Node 24) handles the
          # pushtodisplay shrinkwrap's optional esbuild platform packages;
          # npm 10 on Node 22 fails npm ci with EBADPLATFORM.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check
